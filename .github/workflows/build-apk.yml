name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          RAW_VER=$(java -version 2>&1 | head -n 1)
          echo "Raw Java Version Output: $RAW_VER"
          JAVA_VER=$(echo "$RAW_VER" | grep -oE '"[0-9]+' | tr -d '"')
          if [ -z "$JAVA_VER" ]; then
            JAVA_VER=$(echo "$RAW_VER" | awk -F '"' '{print $2}' | cut -d'.' -f1)
          fi
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java major version $JAVA_VER is lower than 17."
            exit 1
          fi
          echo "Active Java major version: $JAVA_VER (>= 17 verified)"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "debug.keystore already exists."
          fi
          mkdir -p ~/.android
          cp ./debug.keystore ~/.android/debug.keystore
          if [ ! -f ./debug.keystore ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Expected debug APK not found at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            fi
            echo "Error: Exact debug APK file $APK_PATH does not exist."
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file $APK_PATH is empty."
            exit 1
          fi
          echo "Verified debug APK exists at: $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR="${{ runner.temp }}/release_asset_dir"
          mkdir -p "$TEMP_DIR"
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/_/g')
          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_DIR}/${ASSET_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Failed to prepare release asset."
            exit 1
          fi
          echo "ASSET_PATH=$ASSET_PATH" >> $GITHUB_OUTPUT
          echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_OUTPUT
          echo "Prepared release asset: $ASSET_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.ASSET_PATH }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset $ASSET_PATH missing or empty."
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES="### Automatic Debug APK Build
          - **Type:** Automatically generated debug APK
          - **Built by:** GitHub Actions
          - **Run Number:** #${{ github.run_number }}
          - **Run Attempt:** #${{ github.run_attempt }}
          - **Source Commit:** \`${{ github.sha }}\`
          - **Note:** This APK is intended for testing and is not a Play Store production release. It is signed only with a temporary debug keystore."

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.ASSET_NAME }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"

          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            echo "Release publishing succeeded!"
            gh release view "$TAG_NAME" || true
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            echo "## 🚀 Debug APK Build & Release Successful" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Page:** [$RELEASE_URL]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **APK Asset Filename:** \`$ASSET_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "- You can download the APK directly from the **Assets** section of the release." >> $GITHUB_STEP_SUMMARY
            echo "- The normal Actions artifact \`app-debug-apk\` is also available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::Release publishing failed or encountered an error."
            echo "The APK build and artifact upload succeeded."
            echo "The artifact 'app-debug-apk' remains available on GitHub Actions."

            echo "## ⚠️ APK Build Succeeded (Release Publishing Warning)" >> $GITHUB_STEP_SUMMARY
            echo "- **APK Build:** Succeeded" >> $GITHUB_STEP_SUMMARY
            echo "- **Artifact Upload:** Succeeded" >> $GITHUB_STEP_SUMMARY
            echo "- **Actions Artifact Name:** \`app-debug-apk\`" >> $GITHUB_STEP_SUMMARY
            echo "- Release publishing encountered an error, but your APK is safely stored in the GitHub Actions artifacts section." >> $GITHUB_STEP_SUMMARY
          fi
